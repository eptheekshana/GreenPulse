<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | GreenPulse</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Google Fonts (Outfit) as defined in the plan -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">
                <i class="ph-fill ph-leaf brand-icon"></i>
                <span class="brand-text">GreenPulse</span>
            </a>
            <div class="nav-actions">
                <div class="status-indicator">
                    <span class="dot active" id="connection-dot"></span>
                    <span id="connection-status">Live</span>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <i class="ph-bold ph-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
        
        <div id="alert-banner" class="card" style="display: none; border-color: var(--danger); background: var(--danger-light); margin-bottom: 2rem;">
            <div style="display: flex; align-items: center; gap: 1rem; color: var(--danger);">
                <i class="ph-bold ph-warning-circle" style="font-size: 1.5rem;"></i>
                <span id="alert-message" style="font-weight: 500;">Warning Message</span>
            </div>
        </div>

        <main class="dashboard-grid">
            <!-- Environment Cards -->
            <div class="card glass">
                <div class="card-header">
                    <h3>Temperature</h3>
                    <div class="icon"><i class="ph-fill ph-thermometer"></i></div>
                </div>
                <div class="card-value">
                    <span id="temp-val">--</span><span class="unit">°C</span>
                </div>
            </div>

            <div class="card glass">
                <div class="card-header">
                    <h3>Humidity</h3>
                    <div class="icon"><i class="ph-fill ph-drop"></i></div>
                </div>
                <div class="card-value">
                    <span id="hum-val">--</span><span class="unit">%</span>
                </div>
            </div>

            <div class="card glass highlight">
                <div class="card-header">
                    <h3>Soil Moisture</h3>
                    <div class="icon"><i class="ph-fill ph-plant"></i></div>
                </div>
                <div class="card-value">
                    <span id="soil-val">--</span><span class="unit">%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="soil-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="card glass">
                <div class="card-header">
                    <h3>Water Level</h3>
                    <div class="icon"><i class="ph-fill ph-waves"></i></div>
                </div>
                <div class="card-value">
                    <span id="water-val">--</span><span class="unit">%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="water-bar" style="width: 0%"></div>
                </div>
            </div>

            <!-- Historical Data Chart -->
            <div class="card glass chart-panel">
                <div class="card-header">
                    <h3>Environmental History</h3>
                    <div class="icon"><i class="ph-fill ph-chart-line-up"></i></div>
                </div>
                <div style="position: relative; height: 350px; width: 100%;">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>

            <!-- System Info Panel -->
            <div class="card glass system-panel">
                <div class="card-header">
                    <h3>System Controller</h3>
                </div>
                <ul class="system-list">
                    <li>
                        <span>Mode</span>
                        <span class="badge active" id="mode-status">AUTO</span>
                    </li>
                    <li>
                        <span>Pump Status</span>
                        <span class="badge inactive" id="pump-status">OFF</span>
                    </li>
                    <li>
                        <span>Network</span>
                        <span style="color: var(--primary); font-weight: 700;">Online</span>
                    </li>
                    <li>
                        <span>Last Sync</span>
                        <span id="last-update">Just now</span>
                    </li>
                </ul>
                <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; justify-content: flex-end;">
                    <div style="display: flex; gap: 0.5rem; background: var(--bg-body); padding: 0.4rem; border-radius: 50px; border: 1px solid var(--border-color);">
                        <button id="btn-mode-auto" class="btn btn-primary" onclick="setMode(true)">Auto Mode</button>
                        <button id="btn-mode-manual" class="btn btn-outline" style="border:none;" onclick="setMode(false)">Manual</button>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="btn-pump-on" class="btn btn-outline" style="border-color: var(--primary); color: var(--primary);" onclick="setPump('on')">Force Pump ON</button>
                        <button id="btn-pump-off" class="btn btn-danger-outline" onclick="setPump('off')">Force Pump OFF</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        const elements = {
            tempVal: document.getElementById('temp-val'),
            humVal: document.getElementById('hum-val'),
            soilVal: document.getElementById('soil-val'),
            soilBar: document.getElementById('soil-bar'),
            waterVal: document.getElementById('water-val'),
            waterBar: document.getElementById('water-bar'),
            modeStatus: document.getElementById('mode-status'),
            btnModeAuto: document.getElementById('btn-mode-auto'),
            btnModeManual: document.getElementById('btn-mode-manual'),
            pumpStatus: document.getElementById('pump-status'),
            lastUpdate: document.getElementById('last-update'),
            btnPumpOn: document.getElementById('btn-pump-on'),
            btnPumpOff: document.getElementById('btn-pump-off'),
            connectionDot: document.getElementById('connection-dot'),
            connectionStatus: document.getElementById('connection-status'),
            alertBanner: document.getElementById('alert-banner'),
            alertMessage: document.getElementById('alert-message')
        };

        let uiLock = false;
        let uiLockTimeout = null;
        const UPDATE_INTERVAL = 2000;
        
        // Chart.js Setup
        const ctx = document.getElementById('historyChart').getContext('2d');
        const getChartColors = () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            return {
                gridColor: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)',
                textColor: isDark ? '#9ca3af' : '#6b7280'
            };
        };

        let chartColors = getChartColors();

        const historyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Soil Moisture (%)',
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        data: [],
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Temperature (°C)',
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        data: [],
                        tension: 0.4
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        data: [],
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: chartColors.textColor }
                    }
                },
                scales: {
                    x: {
                        grid: { color: chartColors.gridColor },
                        ticks: { color: chartColors.textColor }
                    },
                    y: {
                        grid: { color: chartColors.gridColor },
                        ticks: { color: chartColors.textColor }
                    }
                },
                animation: { duration: 0 } // Disable animation for live updates
            }
        });

        // Listen for theme changes from script.js
        window.addEventListener('themeChanged', () => {
            chartColors = getChartColors();
            historyChart.options.plugins.legend.labels.color = chartColors.textColor;
            historyChart.options.scales.x.grid.color = chartColors.gridColor;
            historyChart.options.scales.x.ticks.color = chartColors.textColor;
            historyChart.options.scales.y.grid.color = chartColors.gridColor;
            historyChart.options.scales.y.ticks.color = chartColors.textColor;
            historyChart.update();
        });

        async function fetchSensorData() {
            try {
                const response = await fetch('/api/data');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                updateDashboard(data);
                
                // Fetch History
                const histResponse = await fetch('/api/history');
                const historyData = await histResponse.json();
                updateChart(historyData);

                updateConnection(true);
            } catch (error) {
                console.error('Fetch error:', error);
                updateConnection(false);
            }
        }

        function updateChart(historyData) {
            const labels = [];
            const soilData = [];
            const tempData = [];
            const humData = [];

            historyData.forEach(pt => {
                const date = new Date(pt.timestamp);
                labels.push(`${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`);
                soilData.push(pt.soilMoisture);
                tempData.push(pt.temperature);
                humData.push(pt.humidity);
            });

            historyChart.data.labels = labels;
            historyChart.data.datasets[0].data = soilData;
            historyChart.data.datasets[1].data = tempData;
            historyChart.data.datasets[2].data = humData;
            historyChart.update();
        }

        function updateDashboard(data) {
            elements.tempVal.innerText = data.temperature.toFixed(1);
            elements.humVal.innerText = Math.round(data.humidity);
            elements.soilVal.innerText = Math.round(data.soilMoisture);
            elements.waterVal.innerText = Math.round(data.waterLevel);

            elements.soilBar.style.width = `${data.soilMoisture}%`;
            elements.waterBar.style.width = `${data.waterLevel}%`;

            if (data.soilMoisture < 30) {
                elements.soilBar.style.backgroundColor = 'var(--danger)';
            } else if (data.soilMoisture < 60) {
                elements.soilBar.style.backgroundColor = 'var(--primary)';
            } else {
                elements.soilBar.style.backgroundColor = 'var(--accent)';
            }

            if (data.waterLevel < 20) {
                elements.waterBar.style.backgroundColor = 'var(--danger)';
            } else {
                elements.waterBar.style.backgroundColor = 'var(--primary)';
            }

            if (!uiLock) {
                if (data.pumpActive) {
                    elements.pumpStatus.innerText = "ON";
                    elements.pumpStatus.className = "badge active";
                } else {
                    elements.pumpStatus.innerText = "OFF";
                    elements.pumpStatus.className = "badge inactive";
                }
                
                if (data.autoMode) {
                    elements.modeStatus.innerText = "AUTO";
                    elements.modeStatus.className = "badge active";
                    
                    elements.btnModeAuto.className = "btn btn-primary";
                    elements.btnModeAuto.style.border = "2px solid transparent";
                    
                    elements.btnModeManual.className = "btn btn-outline";
                    elements.btnModeManual.style.border = "none";

                    elements.btnPumpOn.disabled = true;
                    elements.btnPumpOff.disabled = true;
                } else {
                    elements.modeStatus.innerText = "MANUAL";
                    elements.modeStatus.className = "badge warning";
                    
                    elements.btnModeAuto.className = "btn btn-outline";
                    elements.btnModeAuto.style.border = "none";

                    elements.btnModeManual.className = "btn btn-primary";
                    elements.btnModeManual.style.border = "2px solid transparent";

                    elements.btnPumpOn.disabled = false;
                    elements.btnPumpOff.disabled = false;
                }
            }

            if (data.alert && data.alert !== "") {
                elements.alertMessage.innerText = data.alert;
                elements.alertBanner.style.display = 'flex';
            } else {
                elements.alertBanner.style.display = 'none';
            }

            const now = new Date();
            elements.lastUpdate.innerText = now.toLocaleTimeString();
        }

        async function sendCommand(payload) {
            try {
                await fetch('/api/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error(e);
            }
        }

        function applyUiLock() {
            uiLock = true;
            if (uiLockTimeout) clearTimeout(uiLockTimeout);
            uiLockTimeout = setTimeout(() => { uiLock = false; }, 4000);
        }

        function setPump(state) {
            applyUiLock();
            if (state === 'on') {
                elements.pumpStatus.innerText = "ON";
                elements.pumpStatus.className = "badge active";
            } else {
                elements.pumpStatus.innerText = "OFF";
                elements.pumpStatus.className = "badge inactive";
            }
            sendCommand({ pumpState: state });
        }

        function setMode(isAuto) {
            applyUiLock();
            if (isAuto) {
                elements.modeStatus.innerText = "AUTO";
                elements.modeStatus.className = "badge active";
                
                elements.btnModeAuto.className = "btn btn-primary";
                elements.btnModeAuto.style.border = "2px solid transparent";
                
                elements.btnModeManual.className = "btn btn-outline";
                elements.btnModeManual.style.border = "none";
                
                elements.btnPumpOn.disabled = true;
                elements.btnPumpOff.disabled = true;
            } else {
                elements.modeStatus.innerText = "MANUAL";
                elements.modeStatus.className = "badge warning";
                
                elements.btnModeAuto.className = "btn btn-outline";
                elements.btnModeAuto.style.border = "none";
                
                elements.btnModeManual.className = "btn btn-primary";
                elements.btnModeManual.style.border = "2px solid transparent";
                
                elements.btnPumpOn.disabled = false;
                elements.btnPumpOff.disabled = false;
            }
            sendCommand({ autoMode: isAuto });
        }

        function updateConnection(isOnline) {
            if (isOnline) {
                elements.connectionDot.className = 'dot active';
                elements.connectionStatus.innerText = 'Live';
            } else {
                elements.connectionDot.className = 'dot error';
                elements.connectionStatus.innerText = 'Offline';
            }
        }

        // Init
        fetchSensorData();
        setInterval(fetchSensorData, UPDATE_INTERVAL);
    </script>
</body>
</html>
